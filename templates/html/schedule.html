<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Графік відключень</title>
  <link rel="stylesheet" href="schedule.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <!-- knock a gap around the slash so it reads on any cell background -->
      <mask id="m-slash" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
        <rect width="24" height="24" fill="#fff"/>
        <path d="M3.5 3.5 20.5 20.5" stroke="#000" stroke-width="3.8" stroke-linecap="round"/>
      </mask>
      <clipPath id="c-left"><rect x="0" y="0" width="12" height="24"/></clipPath>
      <clipPath id="c-right"><rect x="12" y="0" width="12" height="24"/></clipPath>
      <path id="p-bolt" d="M14.8 1.5 4.2 13.6h6.4l-1.4 8.9 10.6-12.3h-6.4z"/>
    </defs>
    <symbol id="i-off" viewBox="0 0 24 24">
      <g mask="url(#m-slash)">
        <use href="#p-bolt" fill="#1f2430" stroke="#1f2430" stroke-width="1.1" stroke-linejoin="round"/>
      </g>
      <path d="M3.5 3.5 20.5 20.5" stroke="#1f2430" stroke-width="1.7" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-first" viewBox="0 0 24 24">
      <g mask="url(#m-slash)">
        <use href="#p-bolt" fill="#1f2430" clip-path="url(#c-left)"/>
        <use href="#p-bolt" fill="#f5c400" clip-path="url(#c-right)"/>
        <use href="#p-bolt" fill="none" stroke="#1f2430" stroke-width="1.1" stroke-linejoin="round"/>
      </g>
      <path d="M3.5 3.5 20.5 20.5" stroke="#1f2430" stroke-width="1.7" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-second" viewBox="0 0 24 24">
      <g mask="url(#m-slash)">
        <use href="#p-bolt" fill="#f5c400" clip-path="url(#c-left)"/>
        <use href="#p-bolt" fill="#1f2430" clip-path="url(#c-right)"/>
        <use href="#p-bolt" fill="none" stroke="#1f2430" stroke-width="1.1" stroke-linejoin="round"/>
      </g>
      <path d="M3.5 3.5 20.5 20.5" stroke="#1f2430" stroke-width="1.7" stroke-linecap="round"/>
    </symbol>
  </svg>

  <div class="container">
    <h1 id="title"></h1>
    <p class="updated" id="updated"></p>
    <div class="tablewrap">
      <table id="grid">
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="legend" id="legend"></div>
    <p class="credit" id="credit"></p>
  </div>

  <script src="schedule.js"></script>
</body>
</html>
